<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>字体查找</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- Search Section -->
      <section class="search-section">
        <div class="search-box">
          <input id="imageInput" type="file" accept="image/*" hidden />
          <input
            id="fontInput"
            type="text"
            spellcheck="false"
            placeholder="请输入字体名，或 Ctrl+V 粘贴截图"
          />
          <button id="searchBtn" class="icon-btn search-btn" type="button" title="搜索字体">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </button>
        </div>
        <p id="ocrStatus" class="ocr-status"></p>
      </section>

      <!-- Results Section -->
      <section id="resultsSection" class="results-section" hidden>
        <div id="resultsHeader" class="results-header">
          <span id="resultCount" class="result-count"></span>
          <div id="fontFilters" class="font-filters"></div>
        </div>
        <div id="resultList" class="result-list"></div>
      </section>

    <script type="module" src="/app.js"></script>
  </body>
</html>
